name: Verify Microsoft Store connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-connection:
    runs-on: windows-latest
    steps:
      - name: Check required credentials are configured
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $requiredSecrets = @(
            'AZURE_AD_APPLICATION_CLIENT_ID',
            'AZURE_AD_APPLICATION_SECRET',
            'AZURE_AD_TENANT_ID',
            'SELLER_ID'
          )
          foreach ($name in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub Actions secret is missing or empty: $name"
            }
          }
          Write-Host 'All required Microsoft Store connection secrets are present.'

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
        with:
          version: v0.4.3

      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Verify access to Trivia Countdown product
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Suppress product details; a successful exit proves authenticated read access.
          msstore apps get 9PBDS94C8XD0 | Out-Null
          Write-Host 'Authenticated read access to the Trivia Countdown Store product succeeded.'
