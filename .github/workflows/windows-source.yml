name: Windows source checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Run source checks
        shell: pwsh
        run: |
          uv sync --frozen
          uv run python -m compileall -q make_trivia_countdown.py make_trivia_countdown_gui.py trivia_countdown
          uv run python -m unittest tests.test_app
          uv run python make_trivia_countdown.py --help
