name: Build unsigned macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install build tools
        run: brew install pkg-config

      - name: Run source checks
        run: |
          uv sync --group build --frozen
          uv run python -m py_compile make_trivia_countdown.py make_trivia_countdown_gui.py trivia_countdown/*.py trivia_countdown/lib/*.py
          uv run python -m unittest tests.test_app
          uv run python make_trivia_countdown.py --help

      - name: Cache FFmpeg build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ffmpeg
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build_ffmpeg_macos.sh', 'scripts/compile_ffmpeg_macos.sh') }}

      - name: Build FFmpeg and x264
        run: scripts/build_ffmpeg_macos.sh

      - name: Test bundled FFmpeg
        run: PATH="$PWD/build/vendor/bin:$PATH" uv run python -m unittest tests.test_app

      - name: Build and verify DMG
        run: scripts/build_macos_dmg.sh

      - name: Smoke-test packaged app
        run: |
          TRIVIA_COUNTDOWN_SMOKE_TEST=1 "dist/Trivia Countdown.app/Contents/MacOS/Trivia Countdown"
          "dist/Trivia Countdown.app/Contents/Frameworks/bin/ffmpeg" -version
          "dist/Trivia Countdown.app/Contents/Frameworks/bin/ffprobe" -version
          codesign --verify --deep --strict --verbose=2 "dist/Trivia Countdown.app"
          hdiutil verify dist/*.dmg
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.dmg
            dist/*-sources.tar.gz
            dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivia-countdown-macos-arm64
          path: |
            dist/*.dmg
            dist/*-sources.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: trivia-countdown-macos-arm64
          path: dist

      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ $(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) != "true" ]]; then
              echo "error: refusing to replace assets on a published release" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --generate-notes \
              --title "Trivia Countdown $GITHUB_REF_NAME"
          fi
